name: build-win-imhex

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 源码：WerWolv/ImHex（CMake 工程：libimhex lib +
      # imhex-gui/imhex CLI bin + plugins/builtin 等子模块）===
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: WerWolv/ImHex
          ref: master
          submodules: recursive
          path: imhex_source
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # === 构建 Windows x64 portable release ===
      - name: Setup MSVC Dev Environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # 修复：手动引导最新 vcpkg（替代 friendlyanon/setup-vcpkg 的旧固定提交）
      # ImHex 的 vcpkg.json 指定 builtin-baseline 为 9e593bb...，需要 vcpkg
      # 的 git 历史中包含此提交才能解析依赖版本（curl 8.21.0#1、
      # vcpkg-cmake-config 2026-07-21 等较新条目）
      - name: Setup vcpkg (latest)
        shell: pwsh
        run: |
          # Full clone ensures builtin-baseline commits are reachable for version resolution
          git clone https://github.com/microsoft/vcpkg $env:RUNNER_TEMP/vcpkg
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" >> $env:GITHUB_ENV
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/vcpkg"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      # 复制 vcpkg.json 到根目录以启用 CMake manifest 模式
      # （CMake 的 vcpkg toolchain 会自动检测并运行 vcpkg install）
      - name: Prepare vcpkg manifest
        working-directory: imhex_source
        shell: pwsh
        run: |
          if (Test-Path "dist/vcpkg.json" -and -not (Test-Path "vcpkg.json")) {
            Copy-Item "dist/vcpkg.json" "vcpkg.json" -Force
            Write-Host "Copied vcpkg.json from dist/ to root"
          } else {
            Write-Host "vcpkg.json already in place or not in dist/"
          }

      # CMake 配置 + 构建：
      # vcpkg install 会在 CMake project() 调用时通过 toolchain 自动触发，
      # 无需单独的 vcpkg install 步骤
      - name: Configure and build release
        working-directory: imhex_source
        shell: pwsh
        run: |
          # Configure - let CMake auto-detect cl.exe from MSVC environment
          cmake -G "Ninja" -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE="Release" `
            -DCMAKE_INSTALL_PREFIX="$(Join-Path $PWD 'build\install')" `
            -DIMHEX_USE_DEFAULT_BUILD_SETTINGS=ON `
            -DIMHEX_PATTERNS_PULL_MASTER=ON `
            -DIMHEX_COMMIT_HASH_LONG="$env:GITHUB_SHA" `
            -DIMHEX_COMMIT_BRANCH="master" `
            .

          # Build
          cmake --build build --config Release --target install --parallel

          # ImHex 通过检测此文件判断 portable 模式
          "ImHex portable marker" | 
            Out-File -FilePath "build\install\PORTABLE" -Encoding ascii -NoNewline

          # 产物校验
          $exe = Get-Item "build\install\imhex.exe" -ErrorAction SilentlyContinue
          if (-not $exe) {
            throw "build/install/imhex.exe not found - build failed"
          }
          $sizeMB = [math]::Round($exe.Length / 1MB, 1)
          Write-Host "=== imhex.exe: $sizeMB MB ==="
          if ($exe.Length -lt 5MB) {
            throw "imhex.exe is only $sizeMB MB - below threshold, likely a broken build"
          }

          "IMHEX_BUILD_OK=1" >> $env:GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/imhex-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r imhex_source/build/install/* "$DEST/"
          echo "=== dist content ==="
          du -sh "$DEST"
          # 交叉验证：exe 入场且非空
          [ -f "$DEST/imhex.exe" ] || { echo "imhex.exe missing in dist"; exit 1; }
          [ "$(stat -c%s "$DEST/imhex.exe")" -gt 5000000 ] || { echo "imhex.exe too small"; exit 1; }
          [ -f "$DEST/PORTABLE" ] || { echo "PORTABLE marker missing"; exit 1; }

      # === Release ===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/imhex-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-imhex"
