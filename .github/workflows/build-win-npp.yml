name: build-win-npp

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 源码：notepad-plus-plus master（活跃主线，2026-10 仍在发版）===
      # 仓库无 submodule（官方 CI 的 checkout 均未配 submodules 键），
      # Boost 1.90.0 裁剪版直接内嵌在 boostregex/boost 目录，无外部依赖
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: notepad-plus-plus/notepad-plus-plus
          ref: master
          path: npp_source
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # === MSBuild（windows-latest 自带 VS2022 v143，满足 BUILD.md
      # 的 VS 2022 17.5+ 要求；此步仅把 msbuild 加入 PATH）===
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # === 构建 x64 Release ===
      # 与官方 CI_build.yml 完全一致的命令：msbuild notepadPlus.sln
      # /m /p:configuration=Release /p:platform=x64
      # 输出：PowerEditor\bin64\Notepad++.exe（appveyor 与官方 CI 的
      # x64/Release artifact 路径均为 bin64）
      - name: Build x64 Release
        working-directory: npp_source/PowerEditor/visual.net
        shell: pwsh
        run: |
          msbuild notepadPlus.sln /m /p:configuration=Release /p:platform=x64
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with $LASTEXITCODE" }

          $exe = "..\bin64\Notepad++.exe"
          if (-not (Test-Path $exe)) { throw "Notepad++.exe not produced at $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "=== Notepad++.exe: $([math]::Round($size/1MB,2)) MB ==="

          # 硬失败判定：x64 PE 标志 + 版本信息非空，杜绝空壳产物
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("not x64 PE (Machine=0x{0:X4})" -f $machine) }
          Write-Host "x64 PE verified OK"
          $ver = (Get-Item (Resolve-Path $exe)).VersionInfo
          Write-Host "FileVersion: $($ver.FileVersion)"
          if ([string]::IsNullOrWhiteSpace($ver.FileVersion)) {
            throw "empty version info - build may be broken"
          }

      # === 组装 portable 包（对齐官方 packageAll.bat 的
      # zipped.package.release64 清单；素材路径按文件名全树搜索定位，
      # 排除 build64 中间目录，规避仓库目录结构漂移）===
      - name: Assemble portable package
        working-directory: npp_source/PowerEditor
        shell: pwsh
        run: |
          function Get-Source([string]$name) {
            Get-ChildItem . -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\build64\\' } |
              Select-Object -First 1
          }
          $missing = @()

          function Copy-Found([string]$name, [string]$dest, [string]$destName) {
            $hit = Get-Source $name
            if ($hit) {
              Copy-Item $hit.FullName (Join-Path $dest $destName) -Force
              Write-Host ("  + {0} <- {1}" -f $name, $hit.FullName.Substring((Get-Location).Path.Length + 1))
            } else {
              Write-Host "  !! NOT FOUND: $name"
              $script:missing += $name
            }
          }

          $pkg = "portable"
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null

          # --- 根层文件 ---
          Copy-Item "bin64\Notepad++.exe" "$pkg\Notepad++.exe"
          # 官方 portable 用 license.txt 命名（GPL 文本，仓库根的 LICENSE）
          $lic = Get-Source "LICENSE"
          if ($lic) { Copy-Item $lic.FullName "$pkg\license.txt" }
          else { $missing += "LICENSE" }
          foreach ($f in "readme.txt", "change.log") { Copy-Found $f $pkg $f }
          foreach ($f in "langs.model.xml", "stylers.model.xml",
                         "tabContextMenu_example.xml", "toolbarButtonsConf_example.xml") {
            Copy-Found $f $pkg $f
          }

          # --- portable 标志 + 禁自动更新标记（内容无关，文件名即开关，
          # 官方 packageAll.bat 亦为占位文件，直接生成）---
          New-Item -ItemType File -Path "$pkg\doLocalConf.xml" -Force | Out-Null
          New-Item -ItemType File -Path "$pkg\disableNppAutoUpdate.xml" -Force | Out-Null

          # --- 目录素材（官方 portable 命名：nativeLang→localization、APIs→autoCompletion）---
          foreach ($map in @(@("nativeLang", "localization"),
                             @("APIs", "autoCompletion"),
                             @("functionList", "functionList"),
                             @("themes", "themes"))) {
            $src = Get-ChildItem . -Recurse -Directory -Filter $map[0] -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\build64\\' } |
              Where-Object { $_.Parent.Name -eq "installer" } |
              Select-Object -First 1
            if (-not $src) {
              $src = Get-ChildItem . -Recurse -Directory -Filter $map[0] -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch '\\build64\\' } | Select-Object -First 1
            }
            if ($src) {
              Copy-Item $src.FullName "$pkg\$($map[1])" -Recurse -Force
              Write-Host ("  + dir {0} <- {1}" -f $map[0], $src.FullName.Substring((Get-Location).Path.Length + 1))
            } else {
              Write-Host "  !! DIR NOT FOUND: $($map[0])"
              $missing += $map[0]
            }
          }

          # --- userDefineLangs（预装 Markdown UDL 普通版 + 暗色版）---
          New-Item -ItemType Directory -Path "$pkg\userDefineLangs" -Force | Out-Null
          Copy-Found "markdown._preinstalled.udl.xml" "$pkg\userDefineLangs" "markdown._preinstalled.udl.xml"
          Copy-Found "markdown._preinstalled_DM.udl.xml" "$pkg\userDefineLangs" "markdown._preinstalled_DM.udl.xml"

          # --- updater（以 GUP.exe 为锚点定位整个目录）---
          $gup = Get-Source "GUP.exe"
          if ($gup) { Copy-Item $gup.DirectoryName "$pkg\updater" -Recurse -Force }
          else { $missing += "GUP.exe (updater)" }

          # --- plugins（官方三插件为 solution 构建产物；nppPluginList.dll
          # 为签名 DLL，Plugin Admin 必需）---
          New-Item -ItemType Directory -Path "$pkg\plugins\Config" -Force | Out-Null
          foreach ($pl in @(@("NppExport", "NppExport.dll"),
                            @("mimeTools", "mimeTools.dll"),
                            @("NppConverter", "NppConverter.dll"))) {
            $dll = Get-Source $pl[1]
            if ($dll) {
              New-Item -ItemType Directory -Path "$pkg\plugins\$($pl[0])" -Force | Out-Null
              Copy-Item $dll.FullName "$pkg\plugins\$($pl[0])\"
            } else { $missing += $pl[1] }
          }
          Copy-Found "nppPluginList.dll" "$pkg\plugins\Config" "nppPluginList.dll"

          # --- 硬失败判定：缺失清单一次性报告 ---
          if ($missing.Count -gt 0) {
            throw ("portable assembly incomplete, missing: " + ($missing -join ", "))
          }
          foreach ($req in @("Notepad++.exe", "license.txt", "readme.txt", "change.log",
                             "langs.model.xml", "stylers.model.xml",
                             "doLocalConf.xml", "disableNppAutoUpdate.xml")) {
            if (-not (Test-Path "$pkg\$req")) { throw "portable missing: $req" }
          }

          $files = Get-ChildItem $pkg -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host "=== portable package: $($files.Count) files, $([math]::Round($total/1MB,1)) MB ==="
          if ($total -lt 8MB) { throw "package too small - assembly incomplete" }
          $pkgAbs = (Resolve-Path $pkg).Path -replace '\\', '/'
          "NPP_PKG=$pkgAbs" >> $env:GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/npp-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r "${{ env.NPP_PKG }}"/* "$DEST/"
          echo "=== dist content ==="
          du -sh "$DEST"
          ls "$DEST"
          test -f "$DEST/Notepad++.exe" && test -f "$DEST/doLocalConf.xml"

      # === Release（Notepad++ 为 GPL，无需加密再分发，
      # 但沿用加密通道保持与 uniextract/hdm/x64dbg 一致的私有发布方式）===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/npp-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-npp"
