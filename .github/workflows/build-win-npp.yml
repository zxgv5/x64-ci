name: build-win-npp

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 主程序源码 ===
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: notepad-plus-plus/notepad-plus-plus
          ref: master
          path: npp_source
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      # === 官方三插件源码（npp-plugins org）===
      # 注意：NppConverter/NppExport 的仓库名不带 npp 前缀
      - name: Checkout plugin mimeTools
        uses: actions/checkout@main
        with:
          repository: npp-plugins/mimetools
          ref: master
          path: pl_mimetools

      - name: Checkout plugin NppConverter
        uses: actions/checkout@main
        with:
          repository: npp-plugins/converter
          ref: master
          path: pl_nppconverter

      - name: Checkout plugin NppExport
        uses: actions/checkout@main
        with:
          repository: chcg/NPP_ExportPlugin
          ref: master
          path: pl_nppexport

      - name: Checkout updater wingup
        uses: actions/checkout@main
        with:
          repository: notepad-plus-plus/wingup
          ref: master
          path: wingup
          submodules: recursive

      # === Plugin Admin 插件列表（JSON → 资源 DLL）===
      - name: Checkout nppPluginList
        uses: actions/checkout@main
        with:
          repository: notepad-plus-plus/nppPluginList
          ref: master
          path: npp_pluginlist

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      # === 主程序构建（与官方 CI 命令一致）===
      - name: Build x64 Release (Notepad++.exe)
        working-directory: npp_source/PowerEditor/visual.net
        shell: pwsh
        run: |
          msbuild notepadPlus.sln /m /p:configuration=Release /p:platform=x64
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with $LASTEXITCODE" }

          $exe = "..\bin64\Notepad++.exe"
          if (-not (Test-Path $exe)) { throw "Notepad++.exe not produced at $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "=== Notepad++.exe: $([math]::Round($size/1MB,2)) MB ==="

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("not x64 PE (Machine=0x{0:X4})" -f $machine) }
          Write-Host "x64 PE verified OK"

      # === 官方三插件：从源码构建 ===
      - name: Build official plugins from source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path built_plugins -Force | Out-Null
          $plugins = @(
            @{ repo = "pl_mimetools";    dll = "mimeTools.dll" },
            @{ repo = "pl_nppconverter"; dll = "NppConverter.dll" },
            @{ repo = "pl_nppexport";    dll = "NppExport.dll" }
          )
          foreach ($p in $plugins) {
            Push-Location $p.repo
            try {
              # --- rc 预处理：afxres.h 是 MFC 头，GH runner 无 MFC 组件，
              #    替换为 windows.h（winresrc.h 提供 IDC_STATIC 等常量，等价）---
              Get-ChildItem . -Recurse -Filter *.rc -File | ForEach-Object {
                $c = Get-Content $_.FullName -Raw
                if ($c -match 'afxres\.h') {
                  $c -replace '#\s*include\s*"afxres\.h"', '#include <windows.h>' |
                    Set-Content $_.FullName
                  Write-Host "  patched rc: $($_.FullName)"
                }
              }

              $proj = Get-ChildItem . -Recurse -Include *.sln -File |
                Select-Object -First 1
              if (-not $proj) {
                $proj = Get-ChildItem . -Recurse -Include *.vcxproj -File |
                  Select-Object -First 1
              }
              if (-not $proj) { throw "no sln/vcxproj found in $($p.repo)" }
              Write-Host "=== building $($p.repo): $($proj.Name) ==="

              msbuild $proj.FullName /m /p:Configuration=Release /p:Platform=x64
              if ($LASTEXITCODE -ne 0) {
                Write-Host "--- retry with PlatformToolset=v143 ---"
                msbuild $proj.FullName /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
                if ($LASTEXITCODE -ne 0) { throw "build failed: $($p.repo)" }
              }

              $dll = Get-ChildItem . -Recurse -Filter $p.dll -File |
                Where-Object { $_.FullName -notmatch '\\(obj|intermediate)\\' } |
                Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if (-not $dll) { throw "output $($p.dll) not found in $($p.repo)" }

              $name = [IO.Path]::GetFileNameWithoutExtension($p.dll)
              New-Item -ItemType Directory -Path "..\built_plugins\$name" -Force | Out-Null
              Copy-Item $dll.FullName "..\built_plugins\$name\$($p.dll)"
              Write-Host ("  + {0} v{1}" -f $p.dll,
                (Get-Item $dll.FullName).VersionInfo.FileVersion)
            } finally { Pop-Location }
          }

      # === updater：curl 编译 + 落位，再编 GUP.sln ===
      - name: Build updater (wingup GUP.exe)
        shell: cmd
        run: |
          set "VSWHERE=C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH exit /b 1
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat"

          rem === 1. curl：编译并放到 GUP.vcxproj 期望的 LIBPATH 位置 ===
          set "CURL_LIB=wingup\curl\build\x64\lib\Release\libcurl.lib"
          if exist "%CURL_LIB%" goto curl_ok

          rem -- 动态定位 winbuild（curl 版本不同路径可能不同）--
          set "WINBUILD="
          for /d %%D in ("wingup\curl\*") do if exist "%%~fD\Makefile.vc" set "WINBUILD=%%~fD"
          if not defined WINBUILD set "WINBUILD=wingup\curl\winbuild"
          if not exist "%WINBUILD%\Makefile.vc" (
            echo *** no Makefile.vc found under wingup\curl, tree:
            dir /s /b wingup\curl\Makefile.vc 2>nul
            exit /b 1
          )
          echo using winbuild: %WINBUILD%"

          pushd "%WINBUILD%"
          set WINBUILD_ACKNOWLEDGE_DEPRECATED=yes
          rem mode=static：官方 updater 目录不带 libcurl.dll，GUP 须静态链 curl
          nmake /f Makefile.vc mode=static RTLIBCFG=static MACHINE=x64
          if errorlevel 1 exit /b 1
          popd

          rem -- 产物实际落点因 curl 版本而异，全树搜索后搬到位 --
          if not exist "wingup\curl\build\x64\lib\Release" mkdir "wingup\curl\build\x64\lib\Release"
          for /r "wingup\curl\build" %%f in (libcurl.lib) do copy /y "%%f" "%CURL_LIB%"
          if not exist "%CURL_LIB%" for /r "wingup\curl\build" %%f in (libcurl_a.lib) do copy /y "%%f" "%CURL_LIB%"
          if not exist "%CURL_LIB%" (
            echo *** libcurl not produced, .lib files found in build tree:
            dir /s /b wingup\curl\build\*.lib 2>nul
            exit /b 1
          )
          echo libcurl staged: %CURL_LIB%

          :curl_ok
          rem === 2. GUP.sln ===
          msbuild wingup\vcproj\GUP.sln /m /p:Configuration=Release /p:Platform=x64
          if errorlevel 1 exit /b 1

      - name: Stage updater files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path built_plugins\updater -Force | Out-Null
          Push-Location wingup
          try {
            $gup = Get-ChildItem . -Recurse -Filter GUP.exe -File |
              Where-Object { $_.FullName -notmatch '\\(obj|intermediate)\\' } |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $gup) { throw "GUP.exe not produced by wingup build" }
            Copy-Item $gup.FullName ..\built_plugins\updater\
            Write-Host ("  + GUP.exe v{0}" -f (Get-Item $gup.FullName).VersionInfo.FileVersion)
            foreach ($f in @("gup.xml", "updater.ico", "LICENSE", "README.md")) {
              $hit = Get-ChildItem . -Recurse -Filter $f -File | Select-Object -First 1
              if ($hit) {
                Copy-Item $hit.FullName ..\built_plugins\updater\
                Write-Host "  + $f"
              } else {
                Write-Host "  - skip: $f (not in wingup repo)"
              }
            }
          } finally { Pop-Location }

      # === Plugin Admin 插件列表 DLL（自编版本未签名，官方版带签名）===
      - name: Build nppPluginList.dll
        shell: pwsh
        run: |
          Push-Location npp_pluginlist
          try {
            $proj = Get-ChildItem . -Recurse -Include *.vcxproj, *.sln -File |
              Select-Object -First 1
            if (-not $proj) { throw "no project found in nppPluginList repo" }
            msbuild $proj.FullName /m /p:Configuration=Release /p:Platform=x64
            if ($LASTEXITCODE -ne 0) {
              msbuild $proj.FullName /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
              if ($LASTEXITCODE -ne 0) { throw "nppPluginList build failed" }
            }
            $dll = Get-ChildItem . -Recurse -Filter nppPluginList.dll -File |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $dll) { throw "nppPluginList.dll not produced" }
            New-Item -ItemType Directory -Path ..\built_plugins\Config -Force | Out-Null
            Copy-Item $dll.FullName ..\built_plugins\Config\
            Write-Host "  + nppPluginList.dll (self-built, unsigned)"
          } finally { Pop-Location }

          # 传递暂存区绝对路径给组装步骤
          $abs = (Resolve-Path ..\built_plugins).Path -replace '\\', '/'
          "EXT_BIN=$abs" >> $env:GITHUB_ENV

      # === 组装 portable 包（素材按文件名全树搜索定位）===
      - name: Assemble portable package
        working-directory: npp_source/PowerEditor
        shell: pwsh
        run: |
          function Get-Source([string]$name) {
            Get-ChildItem . -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\build64\\' } |
              Select-Object -First 1
          }
          $missing = @()

          function Copy-Found([string]$name, [string]$dest, [string]$destName) {
            $hit = Get-Source $name
            if ($hit) {
              Copy-Item $hit.FullName (Join-Path $dest $destName) -Force
              Write-Host ("  + {0} <- {1}" -f $name,
                $hit.FullName.Substring((Get-Location).Path.Length + 1))
            } else {
              Write-Host "  !! NOT FOUND: $name"
              $script:missing += $name
            }
          }

          $pkg = "portable"
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null

          # --- 根层文件 ---
          Copy-Item "bin64\Notepad++.exe" "$pkg\Notepad++.exe"
          $lic = Get-Source "LICENSE"
          if ($lic) { Copy-Item $lic.FullName "$pkg\license.txt" }
          else { $missing += "LICENSE" }
          foreach ($f in "readme.txt", "change.log") { Copy-Found $f $pkg $f }
          foreach ($f in "langs.model.xml", "stylers.model.xml",
                         "tabContextMenu_example.xml", "toolbarButtonsConf_example.xml") {
            Copy-Found $f $pkg $f
          }

          # --- portable 标志 + 禁自动更新标记（文件名即开关，占位即可）---
          New-Item -ItemType File -Path "$pkg\doLocalConf.xml" -Force | Out-Null
          New-Item -ItemType File -Path "$pkg\disableNppAutoUpdate.xml" -Force | Out-Null

          # --- 目录素材（官方 portable 命名映射）---
          foreach ($map in @(@("nativeLang", "localization"),
                             @("APIs", "autoCompletion"),
                             @("functionList", "functionList"),
                             @("themes", "themes"))) {
            $src = Get-ChildItem . -Recurse -Directory -Filter $map[0] -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\build64\\' } |
              Where-Object { $_.Parent.Name -eq "installer" } |
              Select-Object -First 1
            if (-not $src) {
              $src = Get-ChildItem . -Recurse -Directory -Filter $map[0] -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch '\\build64\\' } | Select-Object -First 1
            }
            if ($src) {
              Copy-Item $src.FullName "$pkg\$($map[1])" -Recurse -Force
              Write-Host ("  + dir {0} <- {1}" -f $map[0],
                $src.FullName.Substring((Get-Location).Path.Length + 1))
            } else {
              Write-Host "  !! DIR NOT FOUND: $($map[0])"
              $missing += $map[0]
            }
          }

          # --- userDefineLangs（预装 Markdown UDL 两版）---
          New-Item -ItemType Directory -Path "$pkg\userDefineLangs" -Force | Out-Null
          Copy-Found "markdown._preinstalled.udl.xml" "$pkg\userDefineLangs" "markdown._preinstalled.udl.xml"
          Copy-Found "markdown._preinstalled_DM.udl.xml" "$pkg\userDefineLangs" "markdown._preinstalled_DM.udl.xml"

          # --- updater + plugins：来自源码构建暂存区（EXT_BIN）---
          Copy-Item "$env:EXT_BIN\updater" "$pkg\updater" -Recurse -Force
          Write-Host "  + updater/ <- built_plugins (self-built wingup)"

          New-Item -ItemType Directory -Path "$pkg\plugins\Config" -Force | Out-Null
          foreach ($pl in @("NppExport", "mimeTools", "NppConverter")) {
            New-Item -ItemType Directory -Path "$pkg\plugins\$pl" -Force | Out-Null
            Copy-Item "$env:EXT_BIN\$pl\$pl.dll" "$pkg\plugins\$pl\"
            Write-Host "  + plugins\$pl\$pl.dll (self-built)"
          }
          Copy-Item "$env:EXT_BIN\Config\nppPluginList.dll" "$pkg\plugins\Config\"
          Write-Host "  + plugins\Config\nppPluginList.dll (self-built)"

          # --- 硬失败判定 ---
          if ($missing.Count -gt 0) {
            throw ("portable assembly incomplete, missing: " + ($missing -join ", "))
          }
          foreach ($req in @("Notepad++.exe", "license.txt", "readme.txt", "change.log",
                             "langs.model.xml", "stylers.model.xml",
                             "doLocalConf.xml", "disableNppAutoUpdate.xml",
                             "updater\GUP.exe", "updater\gup.xml",
                             "plugins\NppExport\NppExport.dll",
                             "plugins\mimeTools\mimeTools.dll",
                             "plugins\NppConverter\NppConverter.dll",
                             "plugins\Config\nppPluginList.dll")) {
            if (-not (Test-Path "$pkg\$req")) { throw "portable missing: $req" }
          }

          $files = Get-ChildItem $pkg -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host "=== portable package: $($files.Count) files, $([math]::Round($total/1MB,1)) MB ==="
          if ($total -lt 8MB) { throw "package too small - assembly incomplete" }
          $pkgAbs = (Resolve-Path $pkg).Path -replace '\\', '/'
          "NPP_PKG=$pkgAbs" >> $env:GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/npp-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r "${{ env.NPP_PKG }}"/* "$DEST/"
          echo "=== dist content ==="
          du -sh "$DEST"
          ls "$DEST"
          test -f "$DEST/Notepad++.exe" && test -f "$DEST/doLocalConf.xml"

      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/npp-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-npp"
