name: build-win-uniextract

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 源码：gvp9000 fork（活跃主线，2026-10 仍在发版）===
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: gvp9000/UniExtract2
          ref: master
          path: uniextract_source
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Install AutoIt and SciTE4AutoIt3
        shell: pwsh
        run: |
          choco install autoit -y --no-progress

          # AutoIt3Wrapper.exe 为无签名 AutoIt 编译产物，是杀软误报重灾区。
          # Defender 实时防护会在 NSIS 安装器释放它时静默隔离，制造
          # "安装成功但文件消失"。先把目标目录加入排除再装
          Add-MpPreference -ExclusionPath "C:\Program Files (x86)\AutoIt3"
          Add-MpPreference -ExclusionPath "C:\SciTE4AutoIt3"
          choco install scite4autoit3 -y --no-progress

          # 验证 + 诊断：若 Wrapper 仍缺失，打印 Defender 检测记录佐证
          $wrapper = "C:\Program Files (x86)\AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.exe"
          if (-not (Test-Path $wrapper)) {
            Write-Host "=== AutoIt3Wrapper still missing ==="
            Write-Host "--- Defender threat detections mentioning AutoIt ---"
            Get-MpThreatDetection -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Resources } | Select-String -SimpleMatch "AutoIt" |
              Select-Object -First 10
            Write-Host "--- Current Defender exclusions ---"
            (Get-MpPreference).ExclusionPath
            throw "AutoIt3Wrapper not installed - see diagnostics above"
          }
          Write-Host "AutoIt3Wrapper OK: $wrapper"

      # === 编译主程序 ===
      # 通过 AutoIt3Wrapper 调用 Aut2Exe：解析源码指令后产物带
      # 图标/版本资源。Start-Process -Wait 强制等待并捕获退出码，
      # stdout/stderr 重定向到文件后再输出——绕开 pwsh 包装层吞输出的问题
      - name: Compile main executable
        working-directory: uniextract_source
        shell: pwsh
        run: |
          $wrapperCandidates = @(
            "C:\SciTE4AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.exe",
            "C:\Program Files (x86)\AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.exe",
            "C:\Program Files\AutoIt3\SciTE\AutoIt3Wrapper\AutoIt3Wrapper.exe"
          )
          $wrapper = $wrapperCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wrapper) {
            Write-Host "=== AutoIt3Wrapper not found in candidates ==="
            Get-ChildItem "C:\Program Files*\AutoIt3" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            Get-ChildItem "C:\SciTE4AutoIt3" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "AutoIt3Wrapper not found"
          }
          Write-Host "Using wrapper: $wrapper"

          $stdout = "$env:TEMP\wrapper_out.txt"
          $stderr = "$env:TEMP\wrapper_err.txt"
          # /in 指定脚本；指令区已声明 Outfile=.\UniExtract.exe
          $proc = Start-Process -FilePath $wrapper `
            -ArgumentList '/in',"UniExtract.au3",'/prod','/NoPrompt' `
            -WorkingDirectory (Get-Location) `
            -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Write-Host "=== AutoIt3Wrapper exit code: $($proc.ExitCode) ==="
          Write-Host "=== stdout ==="
          Get-Content $stdout -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          Write-Host "=== stderr ==="
          Get-Content $stderr -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }

          if ($proc.ExitCode -ne 0 -or -not (Test-Path "UniExtract.exe")) {
            throw "AutoIt3Wrapper failed (exit=$($proc.ExitCode))"
          }

      # === 验证资源注入 ===
      # 快速确认图标与版本信息已进产物，否则说明 Wrapper 没接管编译
      - name: Verify resources
        working-directory: uniextract_source
        shell: pwsh
        run: |
          $ver = (Get-Item "UniExtract.exe").VersionInfo
          Write-Host "Description: $($ver.FileDescription)"
          Write-Host "FileVersion:  $($ver.FileVersion)"
          Write-Host "Copyright:   $($ver.LegalCopyright)"
          if ([string]::IsNullOrWhiteSpace($ver.FileDescription)) {
            Write-Host "WARNING: FileDescription empty - wrapper may not have processed directives"
          }

      # === helper binaries：从官方更新服务器补齐 ===
      # bin/ 下几十个第三方提取器不在源码仓库中，由更新服务器统一维护。
      # 清单协议：每行 文件名,字节数,MD5；目录条目以 / 结尾，递归取子目录 index。
      # 注意：若 gvp9000 v3.0.6 的 helper 版本与此服务器不一致（如 DiE 签名日期
      # 对不上 2026-06-14），需到 gvp9000 的 GitHub Pages 找其自有更新清单替换 $base
      - name: Download program files from official update server
        working-directory: uniextract_source
        shell: pwsh
        run: |
          $base = "https://update.bioruebe.com/uniextract/data/"
          $index = (Invoke-WebRequest -Uri ($base + "index") -UseBasicParsing).Content -split "`n" | Where-Object { $_.Trim() }
          $count = 0
          foreach ($line in $index) {
            $parts = $line.Split(",")
            if ($parts.Count -lt 3) { continue }
            $file = $parts[0].Trim()
            if ($file.EndsWith("/")) {
              $sub = (Invoke-WebRequest -Uri ($base + $file + "index") -UseBasicParsing).Content -split "`n" | Where-Object { $_.Trim() }
              foreach ($sline in $sub) {
                $sparts = $sline.Split(",")
                if ($sparts.Count -lt 3) { continue }
                $sfile = $sparts[0].Trim()
                if ($sfile.EndsWith("/")) { continue }
                $dest = Join-Path "." $file$sfile
                New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
                Invoke-WebRequest -Uri ($base + $file + $sfile) -OutFile $dest -UseBasicParsing
                $count++
              }
            } else {
              $dest = Join-Path "." $file
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              Invoke-WebRequest -Uri ($base + $file) -OutFile $dest -UseBasicParsing
              $count++
            }
          }
          Write-Host "Downloaded $count files"
          Get-ChildItem ".\bin" -ErrorAction SilentlyContinue |
            Select-Object -First 20 | ForEach-Object { Write-Host "  bin/$($_.Name)" }

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/uniextract-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r uniextract_source/* "$DEST/"
          rm -rf "$DEST/.git"
          find "$DEST" -maxdepth 1 | sort

      # === Release（产物含第三方提取器，禁商用/禁再分发条款，
      # 仅私用，勿公开 release）===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/uniextract-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-uniextract"
