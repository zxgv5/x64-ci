name: build-win-x64dbg

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 源码：x64dbg development 分支（活跃开发主线）===
      # 必须 submodules: recursive——deps（预编译第三方 DLL）、
      # TitanEngine、GleeBug、btparser 都在 submodule 里
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: x64dbg/x64dbg
          ref: development
          path: x64dbg_source
          submodules: recursive
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # === Qt5（项目 find_package(Qt5 Widgets WinExtras)，WinExtras
      # 在 Qt6 已移除，必须 Qt5；5.15 是最后的开源版本）===
      # install-qt-action 自动导出 QT_ROOT_DIR 并把 Qt\bin 加入 PATH
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      # === 构建 Windows x64 Release ===
      # 官方产物目录：源码树 bin\x64（RUNTIME_OUTPUT_DIRECTORY 指定，
      # 与官方 snapshot 包结构一致）；build64 下只有中间文件。
      # deps target 自动调用 windeployqt 把 Qt 运行时 + deps/x64/ 的
      # 预编译 DLL 拷进 bin\x64，无需手动后处理
      - name: Build release
        working-directory: x64dbg_source
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          cmake -B build64 -A x64 -DX64DBG_RELEASE=ON "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

          # 主路径：官方输出目录；fallback：全树搜索（排除 tests 测试插件）
          $bin = ".\bin\x64"
          if (-not (Test-Path "$bin\x64dbg.exe")) {
            $hit = Get-ChildItem . -Recurse -Filter "x64dbg.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\tests\\' } |
              Select-Object -First 1
            if (-not $hit) { throw "x64dbg.exe not found in source tree" }
            $bin = $hit.DirectoryName
          }
          Write-Host "=== output dir: $bin ==="
          $files = Get-ChildItem $bin -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host "=== total: $($files.Count) files, $([math]::Round($total/1MB,1)) MB ==="

          # 硬失败判定：核心四件套（注意 DLL 实名带下划线）+ 总量达标
          foreach ($core in @("x64dbg.exe", "x64gui.dll", "x64_dbg.dll", "x64_bridge.dll")) {
            if (-not (Test-Path (Join-Path $bin $core))) { throw "core missing: $core" }
          }
          if ($total -lt 25MB) { throw "output too small - windeployqt or deps may have failed" }
          "X64DBG_BIN=$bin" >> $env:GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/x64dbg-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r "${{ env.X64DBG_BIN }}"/* "$DEST/"
          echo "=== dist content ==="
          du -sh "$DEST"
          ls "$DEST" | head -40
          # 交叉验证：核心 exe 入场
          test -f "$DEST/x64dbg.exe"

      # === Release（含 Qt5 LGPL 运行时与第三方依赖 DLL，
      # 沿用加密通道保持与 uniextract/hdm 产物一致的私有发布方式）===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/x64dbg-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-x64dbg"
