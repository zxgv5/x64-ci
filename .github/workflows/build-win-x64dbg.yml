name: build-win-x64dbg

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions: write-all
    steps:
      # === 源码：x64dbg development 分支 ===
      # 必须 submodules: recursive——src/dbg/ 下引用了大量预编译 .lib
      # （TitanEngine_x64.lib、XEDParse_x64.lib 等），这些来自 submodule
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: x64dbg/x64dbg
          ref: development
          path: x64dbg_source
          submodules: recursive
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        shell: bash
        run: echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # === 安装 Qt5（项目 find_package(Qt5 Widgets WinExtras)，不用 Qt6）===
      # WinExtras 在 Qt6 已移除，必须 Qt5；5.15 是最后的开源版本
      # aqtinstall 拉取 win64_msvc2019_64 架构，ABI 兼容 VS2022
      - name: Install Qt5
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      # === 构建 Windows x64 Release ===
      # CMAKE_PREFIX_PATH 从 install-qt-action 的输出环境变量取值，
      # 确保 find_package(Qt5) 能定位到 Qt 安装目录
      # 官方 wiki 命令：cmake -B build64 -A x64 + 编译
      - name: Build release
        working-directory: x64dbg_source
        shell: pwsh
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: |
          # install-qt-action 设置了 QT_ROOT_DIR 环境变量，同时把
          # Qt\bin 加入了 PATH——windeployqt 可被 deps.cmake 找到
          Write-Host "QT_ROOT_DIR=$env:QT_ROOT_DIR"
          Write-Host "Qt5_DIR=$env:Qt5_DIR"

          $qtPrefix = $env:QT_ROOT_DIR
          if (-not $qtPrefix -and $env:Qt5_DIR) {
            # Qt5_DIR 指向 lib/cmake/Qt5，向上三级是 Qt 根
            $qtPrefix = (Get-Item $env:Qt5_DIR).Parent.Parent.Parent.FullName
          }
          if (-not $qtPrefix) { throw "Cannot determine Qt root" }
          Write-Host "Qt prefix: $qtPrefix"

          # 官方 wiki 命令 + CMAKE_PREFIX_PATH
          cmake -B build64 -A x64 `
            -DX64DBG_RELEASE=ON `
            "-DCMAKE_PREFIX_PATH=$qtPrefix"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed with $LASTEXITCODE" }

          cmake --build build64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed with $LASTEXITCODE" }

          # 产物收集：CMake 默认输出路径是 build64/Release/
          # （VS 多配置生成器，$<CONFIG> 子目录）
          # deps target 自动调用 windeployqt 收集 Qt 运行时并从
          # deps/x64/ 拷贝预编译 DLL 到 GUI DLL 同级目录
          $bin = ".\build64\Release"
          if (-not (Test-Path "$bin\x64dbg.exe")) {
            Write-Host "=== fallback: searching for x64dbg.exe ==="
            $hit = Get-ChildItem ".\build64" -Recurse -Filter "x64dbg.exe" |
              Select-Object -First 1
            if ($hit) { $bin = $hit.DirectoryName; Write-Host "found at: $bin" }
            else { throw "x64dbg.exe not found anywhere under build64" }
          }

          Write-Host "=== built output ($bin) ==="
          $files = Get-ChildItem $bin -File -ErrorAction SilentlyContinue
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host "=== total: $($files.Count) files, $([math]::Round($total/1MB,1)) MB ==="
          $files | Sort-Object Name | ForEach-Object {
            Write-Host ("  {0}  {1:N0} bytes" -f $_.Name, $_.Length)
          }

          # 硬失败判定：核心四件套必须齐全
          foreach ($core in "x64dbg.exe", "x64gui.dll", "x64dbg.dll", "x64bridge.dll") {
            if (-not (Test-Path (Join-Path $bin $core))) {
              throw "core component missing: $core (searched $bin)"
            }
          }
          if ($files.Count -lt 15 -or $total -lt 25MB) {
            throw "build produced $($files.Count) files, $([math]::Round($total/1MB,1)) MB - windeployqt or deps may have failed"
          }
          "X64DBG_BIN=$bin" >> $env:GITHUB_ENV

      - name: Rename and move
        shell: bash
        run: |
          set -euo pipefail
          DEST="${{ github.workspace }}/dist/x64dbg-${{ env.BUILD_DATE }}"
          mkdir -p "$DEST"
          cp -r "${{ env.X64DBG_BIN }}"/* "$DEST/"
          echo "=== dist content ==="
          du -sh "$DEST"
          find "$DEST" -maxdepth 1 | sort
          # 交叉验证：核心 exe + Qt 平台插件目录入场
          [ -f "$DEST/x64dbg.exe" ] && [ -d "$DEST/platforms" ] || {
            echo "x64dbg.exe or Qt platforms plugin missing in dist"; exit 1; }

      # === Release（含 Qt5 LGPL 运行时与第三方提取器依赖，
      # 沿用加密通道保持私有发布方式）===
      - name: Encrypt package and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ZIP_COMPRESS_LEVEL: '9'
          BUILD_ARTIFACT_PATH: "./dist/x64dbg-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-x64dbg"